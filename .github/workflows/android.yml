name: Build Android APK (debug)
on:
  workflow_dispatch:
  push:
    branches:
      - apk-build
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Copy web files into the mobile project
        run: |
          mkdir -p mobile/www
          cp -r index.html chambers icons manifest.webmanifest sw.js mobile/www/
      - name: Install and create Android project
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          npm install --no-save @capacitor/assets@3
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'
          npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: trader-app-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to branch apk-out
        run: |
          mkdir /tmp/out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/trader-app-debug.apk
          cd /tmp/out
          git init -q -b apk-out
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "APK build"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin apk-out
